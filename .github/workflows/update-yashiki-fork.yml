# shsw228/yashiki の fork ビルドを追いかけて yashiki-fork cask を更新する。
#
# fork 側から repository_dispatch させれば即時反映できるが、それには
# このリポジトリへの write 権限を持つ PAT を fork 側の secret に置く必要がある。
# 自前の GITHUB_TOKEN で足りるようにするため、こちらから取りに行く形にした。
# 急ぐときは workflow_dispatch で手動起動する。
name: Update yashiki-fork cask

on:
  schedule:
    # 毎日 1 回。fork ビルドは push 契機なので、これ以上細かく見る必要はない。
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Bump yashiki-fork
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve the newest fork release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # fork-v* のうち最新のものを取る。作成日時の降順で返るので先頭でよい。
          TAG="$(gh release list --repo shsw228/yashiki --limit 30 \
            --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("fork-v"))]
                  | sort_by(.createdAt) | reverse | .[0].tagName // empty')"
          if [ -z "${TAG}" ]; then
            echo "::error::no fork-v* release found in shsw228/yashiki"
            exit 1
          fi

          VERSION="${TAG#fork-v}"
          CURRENT="$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/yashiki-fork.rb | head -1)"
          echo "latest=${VERSION} current=${CURRENT}"

          if [ "${VERSION}" = "${CURRENT}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ASSET="Yashiki-fork-arm64-${VERSION}.zip"
          gh release download "${TAG}" --repo shsw228/yashiki \
            --pattern "${ASSET}" --dir /tmp/dl
          SHA="$(sha256sum "/tmp/dl/${ASSET}" | cut -d' ' -f1)"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Rewrite the cask
        if: steps.release.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          set -euo pipefail
          CASK=Casks/yashiki-fork.rb
          # version と sha256 の行だけを差し替える。url は version を補間するので触らない。
          sed -i -E "s|^(  version \")[^\"]*(\")\$|\1${VERSION}\2|" "$CASK"
          sed -i -E "s|^(  sha256 \")[^\"]*(\")\$|\1${SHA256}\2|" "$CASK"
          grep -E '^  (version|sha256) ' "$CASK"
          # 置換に失敗して元のままなら気づけるようにする
          grep -q "\"${VERSION}\"" "$CASK"
          grep -q "\"${SHA256}\"" "$CASK"

      - name: Commit
        if: steps.release.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/yashiki-fork.rb
          git commit -m "[chore] yashiki-fork ${VERSION} の cask を更新"
          git push
